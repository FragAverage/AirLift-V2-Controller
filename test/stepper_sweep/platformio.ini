[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; This board only exposes native USB (port shows up as cu.usbmodem*, not
; cu.usbserial*/wchusbserial* from an external UART bridge chip). Without
; these flags, Arduino's Serial defaults to UART0, which isn't wired to
; that USB port, so nothing ever gets printed.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
