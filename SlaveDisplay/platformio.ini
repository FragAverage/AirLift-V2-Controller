; ---------------------------------------------------------------------------
; AirLift V2 — Slave Display (ESP32-2432S028R "Cheap Yellow Display")
;
; Receives AirLiftData over ESP-NOW from the AirLift V2 MITM master and renders
; a 320x240 landscape gauge cluster page.
;
; NOTE: all TFT_eSPI configuration lives here as build flags (USER_SETUP_LOADED)
; so the library folder is never edited and the config survives a clean build /
; lib reinstall. `User_Setup_CYD.h` in this folder is the equivalent file for
; anyone building with the Arduino IDE instead.
; ---------------------------------------------------------------------------
[env:cyd]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The CH340 on this board drops the stub handshake at 921600 ("unable to verify
; flash chip connection"). 460800 is reliable.
upload_speed  = 460800

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  ; Registry only carries an untagged snapshot of this one, so pin the repo.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
  ; ---- TFT_eSPI: ILI9341 on the CYD's HSPI bus -----------------------------
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  ; Keep the panel on HSPI so VSPI stays free for the XPT2046 touch controller.
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  ; Fonts: 2 (16px labels), 4 (26px text), 6 (48px digits-only, big pressures)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D SMOOTH_FONT=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; Touch is compiled in but the unit is cluster-mounted, so it is off by
  ; default. Set to 1 to enable the tap zones.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=0
