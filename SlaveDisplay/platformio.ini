; ---------------------------------------------------------------------------
; AirLift V2 — Slave Display
;
; One firmware across several boards (round21 and lcd147 each have two
; rendering-backend variants), all receiving AirLiftData over ESP-NOW from
; the AirLift V2 MITM master and rendering it as a gauge cluster (plus the
; MFL on-screen menu — see menu.h/menu.cpp). main.cpp, the ESP-NOW layer, and
; the menu state machine are identical across every env; only the display
; and touch backends differ, selected per env below by build_src_filter (so
; each env compiles only the files its libraries can actually satisfy) and
; the geometry/pins in include/config.h.
;
;   env:cyd      — ESP32-2432S028R "Cheap Yellow Display", ILI9341 320x240
;                  landscape + XPT2046 resistive touch. TFT_eSPI. Default env.
;   env:round128 — Waveshare ESP32-S3-Touch-LCD-1.28, GC9A01 240x240 round +
;                  CST816T capacitive touch. TFT_eSPI, same display.cpp/
;                  touch.cpp as cyd.
;   env:round21  — Waveshare ESP32-S3-Touch-LCD-2.1, ST7701 480x480 round
;                  panel over the ESP32-S3's RGB-parallel LCD peripheral
;                  (not SPI) + CST820 capacitive touch. TFT_eSPI has no
;                  working ST7701-RGB support, so this board gets its own
;                  Arduino_GFX-based display_round21.cpp/touch_round21.cpp.
;   env:round21_lvgl — the same round21 board/panel, rendered with LVGL
;                  instead of Arduino_GFX (display_round21_lvgl.cpp). Shares
;                  panel_round21.cpp's ST7701/RGB-peripheral bring-up and
;                  touch_round21.cpp with env:round21 -- see "The round21
;                  board" in README.md. Alternate build, not a fallback: keep
;                  env:round21 buildable as the known-working comparison
;                  while this one is bring-up/unverified on real glass.
;   env:oled13   — generic ESP32-S3 devkit + 1.3" SH1106 128x64 monochrome
;                  OLED, I2C. The intended production screen size — no touch
;                  hardware at all (every input is the MFL menu). Own
;                  Adafruit_SH110X-based display_oled13.cpp/touch_oled13.cpp.
;   env:lcd147   — Waveshare ESP32-S3-LCD-1.47B, ST7789 172x320 SPI panel
;                  rotated to a 320x172 landscape canvas, no touch hardware.
;                  TFT_eSPI, shares display.cpp/touch.cpp with cyd/round128.
;   env:lcd147_lvgl — the same lcd147 board/panel, rendered with LVGL
;                  instead of raw TFT_eSPI draw calls (display_lcd147_lvgl.cpp).
;                  Unlike round21_lvgl, TFT_eSPI stays in lib_deps (this
;                  panel's ST7789 already has working TFT_eSPI support, so
;                  there's no reason to bypass it) -- LVGL just flushes
;                  through tft.pushImage(). touch.cpp is shared unchanged
;                  with env:lcd147. Same "alternate build, not a fallback"
;                  relationship as round21/round21_lvgl.
;
; NOTE: all TFT_eSPI configuration for cyd/round128/lcd147(/lcd147_lvgl)
; lives here as build flags (USER_SETUP_LOADED) so the library folder is
; never edited and the config survives a clean build / lib reinstall.
; `User_Setup_CYD.h` in this folder is the equivalent file for anyone
; building the CYD env with the Arduino IDE instead.
; ---------------------------------------------------------------------------
[platformio]
default_envs = cyd

[env:cyd]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; The CH340 on this board drops the stub handshake at 921600 ("unable to verify
; flash chip connection"). 460800 is reliable.
upload_speed  = 460800

; TFT_eSPI-only files — round21's display_round21.cpp/touch_round21.cpp/
; panel_round21.cpp need Arduino_GFX_Library.h and esp_lcd_*, and
; display_round21_lvgl.cpp needs lvgl.h, none of which are in this env's
; lib_deps.
build_src_filter = +<*> -<display_round21.cpp> -<touch_round21.cpp> -<tca9554.cpp> -<panel_round21.cpp> -<display_round21_lvgl.cpp> -<display_oled13.cpp> -<touch_oled13.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  ; Registry only carries an untagged snapshot of this one, so pin the repo.
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
  ; ---- TFT_eSPI: ILI9341 on the CYD's HSPI bus -----------------------------
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MOSI=13
  -D TFT_MISO=12
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  ; Keep the panel on HSPI so VSPI stays free for the XPT2046 touch controller.
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  ; Fonts: 2 (16px labels), 4 (26px text), 6 (48px digits-only, big pressures)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D SMOOTH_FONT=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; Touch is compiled in but the unit is cluster-mounted, so it is off by
  ; default. Set to 1 to enable the tap zones.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=0

; ---------------------------------------------------------------------------
[env:round128]
; Waveshare ESP32-S3-Touch-LCD-1.28 — GC9A01 240x240 round panel + CST816T
; capacitive touch. ESP32-S3R2, 16MB flash. Flashes over its onboard CH343P
; USB-UART bridge (not the S3's native USB), so this is a plain UART upload
; like the CYD env, just faster.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; The board ships with 16MB flash; the generic esp32-s3-devkitc-1 definition
; assumes less, so make the real size explicit for esptool. Default partition
; table is still fine — this firmware is small.
board_upload.flash_size = 16MB
board_build.flash_mode  = qio

; TFT_eSPI-only files — see the cyd env's note above.
build_src_filter = +<*> -<display_round21.cpp> -<touch_round21.cpp> -<tca9554.cpp> -<panel_round21.cpp> -<display_round21_lvgl.cpp> -<display_oled13.cpp> -<touch_oled13.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  fbiego/CST816S @ ^1.1.1

build_flags =
  ; ---- TFT_eSPI: GC9A01 240x240 round panel ---------------------------------
  ; Pins match Bodmer's own bundled User_Setups/Setup302_Waveshare_ESP32S3_GC9A01.h
  ; — re-verify against your unit if you have a different board revision.
  -D USER_SETUP_LOADED=1
  -D GC9A01_DRIVER=1
  -D TFT_MISO=12
  -D TFT_MOSI=11
  -D TFT_SCLK=10
  -D TFT_CS=9
  -D TFT_DC=8
  -D TFT_RST=14
  -D TFT_BL=2
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  ; Required on ESP32-S3 / Arduino core 3.x or the panel crashes on init
  ; ("Guru Meditation Error ... StoreProhibited") — forces HSPI over FSPI.
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; Fonts: 2 (16px labels), 4 (26px text/values on this smaller panel)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1

  ; ---- Board identity: switches config.h / touch.cpp to the round panel's
  ; geometry, pins, and CST816T capacitive touch driver -----------------------
  -D DISPLAY_ROUND=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; Touch is compiled in but off by default; set to 1 to enable the tap zones.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=0

; ---------------------------------------------------------------------------
[env:round21]
; Waveshare ESP32-S3-Touch-LCD-2.1 — ST7701 480x480 round panel over the
; ESP32-S3's RGB-parallel LCD peripheral + CST820 capacitive touch, both
; behind a TCA9554 I2C IO expander. ESP32-S3-WROOM-1-N16R8: 16MB flash
; (Quad SPI), 8MB PSRAM (Octal SPI) — the RGB panel's two framebuffers live
; in that PSRAM, so getting qio_opi right actually matters here (unlike
; round128, which never touches PSRAM). Unlike the other two envs, this board
; has no external USB-UART bridge chip — it uses the ESP32-S3's *native*
; USB-Serial/JTAG peripheral directly (enumerates under Espressif's own
; VID 0x303A), which is also why ARDUINO_USB_CDC_ON_BOOT below is required:
; without it, Arduino's `Serial` binds to the (unconnected) UART0 pins
; instead of this USB port, and every Serial.print in this firmware goes
; nowhere silently.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

board_upload.flash_size        = 16MB
board_build.flash_mode         = qio
board_build.psram_type         = opi
board_build.arduino.memory_type = qio_opi

; Arduino_GFX-only files — cyd/round128's display.cpp/touch.cpp need
; TFT_eSPI.h, not in this env's lib_deps. display_round21_lvgl.cpp needs
; lvgl.h, also not in this env's lib_deps -- that's env:round21_lvgl's file.
build_src_filter = +<*> -<display.cpp> -<touch.cpp> -<display_oled13.cpp> -<touch_oled13.cpp> -<display_round21_lvgl.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.6

build_flags =
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

  ; Route Arduino's Serial to the native USB-Serial/JTAG peripheral instead
  ; of UART0 — see the env comment above.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; ---- Board identity: switches config.h / display_round21.cpp /
  ; touch_round21.cpp to this panel's pins, geometry, and drivers -----------
  -D BOARD_ROUND21=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; Touch is compiled in but off by default; set to 1 to enable the tap zones.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=0

; ---------------------------------------------------------------------------
[env:round21_lvgl]
; Same physical board/panel as env:round21 above (Waveshare
; ESP32-S3-Touch-LCD-2.1, ST7701 480x480 RGB-parallel panel, CST820 touch,
; TCA9554 IO expander) -- only the rendering backend differs. Panel bring-up
; (panel_round21.cpp) and touch (touch_round21.cpp) are shared verbatim with
; env:round21; only the display.h implementation (display_round21_lvgl.cpp,
; LVGL widgets instead of Arduino_GFX draw calls) and lib_deps differ. See
; "The round21 board" in README.md.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

board_upload.flash_size        = 16MB
board_build.flash_mode         = qio
board_build.psram_type         = opi
board_build.arduino.memory_type = qio_opi

; Arduino_GFX-only file excluded here (display_round21.cpp) instead of
; TFT_eSPI's (display.cpp/touch.cpp) -- this env keeps panel_round21.cpp,
; touch_round21.cpp, tca9554.cpp, and adds display_round21_lvgl.cpp.
build_src_filter = +<*> -<display.cpp> -<touch.cpp> -<display_round21.cpp> -<display_oled13.cpp> -<touch_oled13.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  lvgl/lvgl @ ^9.5.0

build_flags =
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

  ; Route Arduino's Serial to the native USB-Serial/JTAG peripheral instead
  ; of UART0 — see env:round21's comment above.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; ---- Board identity: same round21 pins/geometry/drivers in config.h as
  ; env:round21 -- this is a rendering-backend swap, not a different board.
  -D BOARD_ROUND21=1

  ; ---- LVGL: config lives in include/lv_conf.h. LV_CONF_INCLUDE_SIMPLE
  ; makes lvgl.h do a plain #include "lv_conf.h", but that's a quote-include
  ; -- it only searches the including file's own directory plus the
  ; compiler's -I list, and PlatformIO does NOT put this project's include/
  ; on the include path for a library's own sources (only for src/), just
  ; its -D build_flags (confirmed via `pio run -v`: LV_CONF_INCLUDE_SIMPLE
  ; reaches lvgl's .c files fine, but a bare quote-include of lv_conf.h from
  ; inside .pio/libdeps/.../lvgl/src/ doesn't find ours without this). So
  ; -I is added explicitly here, same "build-flag config, never edit the
  ; library" convention as this file's TFT_eSPI USER_SETUP_LOADED flags.
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I include
  ; lv_font_conv's generated font files (lib/dseg7_font/) guard their own
  ; #include "lvgl.h" behind this same macro name -- without it they take
  ; the `#include "lvgl/lvgl.h"` fallback branch instead, which doesn't
  ; resolve from this project's include paths (same quote-include gotcha as
  ; LV_CONF_INCLUDE_SIMPLE above, different macro).
  -D LV_LVGL_H_INCLUDE_SIMPLE=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; Touch is compiled in but off by default; set to 1 to enable the tap zones.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=1

; ---------------------------------------------------------------------------
[env:oled13]
; Generic ESP32-S3 devkit + 1.3" SH1106 128x64 monochrome OLED, I2C — the
; intended production screen size. No touch hardware; every input is the MFL
; menu instead (touch_oled13.cpp is a stub). No PSRAM needed (the whole
; framebuffer is 128*64/8 = 1KB), so unlike round21 this doesn't need any
; qio_opi/PSRAM configuration. Native USB like round21 — see that env's
; comment for why ARDUINO_USB_CDC_ON_BOOT matters.
;
; This is a generic devkit, not a fixed product with a known spec sheet like
; the other three boards, so flash size is left to PlatformIO's
; esp32-s3-devkitc-1 default rather than guessed — override
; board_upload.flash_size if your board needs it.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; Adafruit_SH110X-only files — the other envs' display/touch files need
; TFT_eSPI.h, Arduino_GFX_Library.h/esp_lcd_*, or lvgl.h, none of which are
; in this env's lib_deps.
build_src_filter = +<*> -<display.cpp> -<touch.cpp> -<display_round21.cpp> -<touch_round21.cpp> -<tca9554.cpp> -<panel_round21.cpp> -<display_round21_lvgl.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  adafruit/Adafruit SH110X @ ^2.1.11
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.14.1

build_flags =
  ; Route Arduino's Serial to the native USB-Serial/JTAG peripheral instead
  ; of UART0 — see the round21 env's comment above.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; ---- Board identity: switches config.h / display_oled13.cpp /
  ; touch_oled13.cpp to this panel's pins, geometry, and driver -------------
  -D BOARD_OLED13=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; No touch hardware on this board — always 0, kept only so every env
  ; defines the same set of flags.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=1

[env:lcd147]
; Waveshare ESP32-S3-LCD-1.47B — ST7789 172x320 SPI panel (rotated to a
; 320x172 landscape canvas), no touch hardware. Also has an onboard QMI8658
; six-axis IMU, TF/SD slot, and an RGB LED, none of which this firmware uses.
; Native USB like round21/oled13 (Type-C straight to the S3, no external
; UART bridge) — see round21's env comment for why ARDUINO_USB_CDC_ON_BOOT
; matters. Pins/specs per Waveshare's own wiki (LCD Pin table + "Arduino
; Project Parameter Setting" section) — re-verify against your unit if you
; have a different revision.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

; Board ships with 16MB flash / QIO, matching Waveshare's own recommended
; Arduino settings for this board (Flash Size 16MB, Flash Mode QIO 80MHz).
board_upload.flash_size = 16MB
board_build.flash_mode  = qio

; TFT_eSPI-only files — see the cyd env's note above.
build_src_filter = +<*> -<display_round21.cpp> -<touch_round21.cpp> -<tca9554.cpp> -<panel_round21.cpp> -<display_round21_lvgl.cpp> -<display_oled13.cpp> -<touch_oled13.cpp> -<display_lcd147_lvgl.cpp>

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43

build_flags =
  ; Route Arduino's Serial to the native USB-Serial/JTAG peripheral instead
  ; of UART0 — see the round21 env's comment above.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; ---- TFT_eSPI: ST7789 172x320 panel ---------------------------------------
  ; Pins per Waveshare's wiki "LCD Pin" table for this board -- no MISO wired
  ; (write-only panel, same as round128's GC9A01).
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_MISO=-1
  -D TFT_MOSI=45
  -D TFT_SCLK=40
  -D TFT_CS=42
  -D TFT_DC=41
  -D TFT_RST=39
  -D TFT_BL=46
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  ; Required on ESP32-S3 / Arduino core 3.x or the panel crashes on init
  ; ("Guru Meditation Error ... StoreProhibited") — same fix round128 needed.
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; Fonts: 2 (16px labels), 4 (26px text/values on this smaller panel)
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1

  ; ---- Board identity: switches config.h to this panel's landscape geometry -
  -D BOARD_LCD147=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; No touch hardware on this board — always 0, kept only so every env
  ; defines the same set of flags.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=1

; ---------------------------------------------------------------------------
[env:lcd147_lvgl]
; Same physical board/panel as env:lcd147 above (Waveshare
; ESP32-S3-LCD-1.47B, ST7789 172x320 SPI panel) -- only the rendering
; backend differs. Unlike round21_lvgl, TFT_eSPI stays in lib_deps here and
; still does panel bring-up + pixel push (tft.pushImage() in the flush
; callback) -- this panel's ST7789 is already well supported by TFT_eSPI,
; unlike round21's ST7701-RGB, so there's no reason to bypass it. Only
; display_lcd147_lvgl.cpp (LVGL widgets) and lib_deps differ from env:lcd147;
; touch.cpp is shared unchanged (this board has no touch hardware either
; way, ENABLE_TOUCH stays 0). See "The round21 board" in README.md for the
; general LVGL-backend approach this env follows too.
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600

board_upload.flash_size = 16MB
board_build.flash_mode  = qio

; display.cpp (raw TFT_eSPI draw calls) excluded in favour of
; display_lcd147_lvgl.cpp -- touch.cpp stays (shared, unchanged).
build_src_filter = +<*> -<display.cpp> -<display_round21.cpp> -<touch_round21.cpp> -<tca9554.cpp> -<panel_round21.cpp> -<display_round21_lvgl.cpp> -<display_oled13.cpp> -<touch_oled13.cpp>

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  lvgl/lvgl @ ^9.5.0

build_flags =
  ; Route Arduino's Serial to the native USB-Serial/JTAG peripheral instead
  ; of UART0 — see the round21 env's comment above.
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

  ; ---- TFT_eSPI: ST7789 172x320 panel, same pins as env:lcd147 -------------
  ; No LOAD_GLCD/FONT2/FONT4/SMOOTH_FONT here -- this backend never calls
  ; TFT_eSPI's own text rendering (tft.drawString() etc.), only
  ; tft.pushImage() to blit LVGL's own rendered pixels, so TFT_eSPI's bitmap
  ; fonts would just be dead flash weight.
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_MISO=-1
  -D TFT_MOSI=45
  -D TFT_SCLK=40
  -D TFT_CS=42
  -D TFT_DC=41
  -D TFT_RST=39
  -D TFT_BL=46
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_WIDTH=172
  -D TFT_HEIGHT=320
  ; Required on ESP32-S3 / Arduino core 3.x or the panel crashes on init
  ; ("Guru Meditation Error ... StoreProhibited") — same fix round128/lcd147 needed.
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000

  ; ---- Board identity: same lcd147 pins/geometry in config.h as env:lcd147 -
  ; this is a rendering-backend swap, not a different board.
  -D BOARD_LCD147=1

  ; ---- LVGL: config lives in include/lv_conf.h -- see env:round21_lvgl's
  ; comment above for why all three of these flags are needed (quote-include
  ; search path gotchas, not optional extras).
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I include
  -D LV_LVGL_H_INCLUDE_SIMPLE=1

  ; ---- Application --------------------------------------------------------
  ; Wi-Fi channel MUST match the channel the master transmits on (its SoftAP
  ; channel if it is running one). Mismatch = packets are never received.
  -D ESPNOW_WIFI_CHANNEL=1
  ; No touch hardware on this board — always 0, kept only so every env
  ; defines the same set of flags.
  -D ENABLE_TOUCH=0
  ; Set to 1 to animate fake pressures when no master is present (bench test).
  -D DEMO_MODE=0
